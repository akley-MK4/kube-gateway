apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: akley-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: akley-common-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: akley-common-ca
  secretName: akley-common-ca
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: akley-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: akley-common-issuer
spec:
  ca:
    secretName: akley-common-ca